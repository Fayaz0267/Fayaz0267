<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Shaik Mahammad Fayaz, I build AI that people can actually use" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="50%" stop-color="#150f3a"/>
      <stop offset="100%" stop-color="#062a3a"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .glow1 { animation: drift1 9s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 11s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(120px,30px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-140px,-20px); } }

    .n { fill: #22d3ee; transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    .n2 { fill: #f472b6; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.7); } }

    .l { stroke: #8b5cf6; stroke-width: 1.2; stroke-opacity: .55; stroke-dasharray: 6 6; animation: dash 4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -48; } }

    .p { fill: #67e8f9; opacity: 0; animation: rise 7s ease-in infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .8; } 100% { transform: translateY(-150px); opacity: 0; } }

    .title { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .fade { opacity: 0; animation: fadein 1.2s ease forwards; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .9s; }
    @keyframes fadein { to { opacity: 1; } }

    .draw { stroke-dasharray: 360; stroke-dashoffset: 360; animation: drawline 2.2s .3s ease forwards; }
    @keyframes drawline { to { stroke-dashoffset: 0; } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <g class="glow1"><circle cx="200" cy="90" r="190" fill="url(#g1)"/></g>
  <g class="glow2"><circle cx="1000" cy="250" r="200" fill="url(#g2)"/></g>

  <!-- left neural cluster -->
  <g>
    <line class="l" x1="90" y1="70" x2="170" y2="140"/>
    <line class="l" x1="170" y1="140" x2="100" y2="220"/>
    <line class="l" x1="170" y1="140" x2="260" y2="90"/>
    <line class="l" x1="100" y1="220" x2="220" y2="250"/>
    <line class="l" x1="170" y1="140" x2="220" y2="250"/>
    <line class="l" x1="50" y1="150" x2="170" y2="140"/>
    <circle class="n" cx="90" cy="70" r="4"/>
    <circle class="n n2" cx="170" cy="140" r="5" style="animation-delay:.5s"/>
    <circle class="n" cx="100" cy="220" r="4" style="animation-delay:1s"/>
    <circle class="n" cx="260" cy="90" r="3.5" style="animation-delay:1.5s"/>
    <circle class="n n2" cx="220" cy="250" r="4" style="animation-delay:2s"/>
    <circle class="n" cx="50" cy="150" r="3.5" style="animation-delay:2.4s"/>
  </g>

  <!-- right neural cluster -->
  <g>
    <line class="l" x1="1110" y1="70" x2="1030" y2="140"/>
    <line class="l" x1="1030" y1="140" x2="1100" y2="220"/>
    <line class="l" x1="1030" y1="140" x2="940" y2="90"/>
    <line class="l" x1="1100" y1="220" x2="980" y2="250"/>
    <line class="l" x1="1030" y1="140" x2="980" y2="250"/>
    <line class="l" x1="1150" y1="150" x2="1030" y2="140"/>
    <circle class="n" cx="1110" cy="70" r="4" style="animation-delay:.3s"/>
    <circle class="n n2" cx="1030" cy="140" r="5" style="animation-delay:.8s"/>
    <circle class="n" cx="1100" cy="220" r="4" style="animation-delay:1.3s"/>
    <circle class="n" cx="940" cy="90" r="3.5" style="animation-delay:1.8s"/>
    <circle class="n n2" cx="980" cy="250" r="4" style="animation-delay:2.2s"/>
    <circle class="n" cx="1150" cy="150" r="3.5" style="animation-delay:2.7s"/>
  </g>

  <!-- rising particles -->
  <circle class="p" cx="330" cy="300" r="2" style="animation-delay:0s"/>
  <circle class="p" cx="450" cy="310" r="1.6" style="animation-delay:1.4s"/>
  <circle class="p" cx="560" cy="300" r="2.2" style="animation-delay:2.8s"/>
  <circle class="p" cx="680" cy="310" r="1.8" style="animation-delay:.7s"/>
  <circle class="p" cx="790" cy="300" r="2" style="animation-delay:2.1s"/>
  <circle class="p" cx="880" cy="310" r="1.6" style="animation-delay:3.5s"/>

  <!-- text -->
  <g class="title">
    <text x="600" y="150" text-anchor="middle" font-size="58" font-weight="800" fill="url(#tg)">Shaik Mahammad Fayaz</text>
  </g>
  <line class="draw" x1="420" y1="172" x2="780" y2="172" stroke="url(#tg)" stroke-width="3" stroke-linecap="round"/>
  <text class="fade d1" x="600" y="214" text-anchor="middle" font-size="23" fill="#e2e8f0">I build AI that people can actually use</text>
  <text class="fade d2" x="600" y="254" text-anchor="middle" font-size="15" letter-spacing="3" fill="#67e8f9">AI/ML  ·  COMPUTER VISION  ·  FULL-STACK</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
